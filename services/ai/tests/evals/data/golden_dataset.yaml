# Retrieval golden dataset: questions a visitor might ask, and the site_chunks content_ids that answer them.
# Entries tagged `paraphrase` deliberately share little vocabulary with their source (lexical-search gap).
entries:
  # --- budgeting ---
  - id: budget-create-manual
    question: How do I create a new budget manually, line by line?
    expected_content_ids: [ngo-guide.2-creating-a-budget]
