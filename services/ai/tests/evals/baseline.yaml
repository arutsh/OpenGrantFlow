# Retrieval eval floors (design.md Decision 7). A metric below its floor, or with no floor, fails CI.
# Floors are the 2026-10-05 measurements rounded down; raise them in the PR that improves retrieval.
top_k: 5
# Top-1 score below this flags a question unanswerable; scores are 0.1 per matched term today.
unanswerable_threshold: 0.25
floors:
  overall:
    recall_at_1: 0.6
    recall_at_3: 0.88
    recall_at_5: 0.88
    mrr: 0.72
    unanswerable_accuracy: 0.75
  categories:
    about: {recall_at_1: 0.5, recall_at_3: 0.75, recall_at_5: 0.75, mrr: 0.62}
    budgeting: {recall_at_1: 0.62, recall_at_3: 1.0, recall_at_5: 1.0, mrr: 0.81}
    currency: {recall_at_1: 0.8, recall_at_3: 1.0, recall_at_5: 1.0, mrr: 0.9}
    dashboards: {recall_at_1: 0.4, recall_at_3: 0.8, recall_at_5: 0.8, mrr: 0.56}
    export: {recall_at_1: 0.0, recall_at_3: 1.0, recall_at_5: 1.0, mrr: 0.44}
    open-source: {recall_at_1: 0.6, recall_at_3: 0.8, recall_at_5: 0.8, mrr: 0.66}
    pilot: {recall_at_1: 0.5, recall_at_3: 0.5, recall_at_5: 0.5, mrr: 0.5}
    reporting: {recall_at_1: 0.66, recall_at_3: 0.88, recall_at_5: 0.88, mrr: 0.77}
    security-privacy: {recall_at_1: 0.85, recall_at_3: 1.0, recall_at_5: 1.0, mrr: 0.9}
