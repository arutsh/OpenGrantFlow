name: AI Service CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - "services/ai/**"
              - "shared/**"

  ai-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grandflow_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grandflow_ai
      AI_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/grandflow_ai
      LOG_LEVEL: INFO
      PYTHONPATH: ${{ github.workspace }}/services/ai:${{ github.workspace }}
      AI_PROVIDER_APPROVED_ORIGINS: '[{"origin": "http://ollama:11434", "allow_private": true}]'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai/requirements.txt

      - name: Lint
        working-directory: ./services/ai
        run: |
          pip install black mypy flake8
          black --check ./app
          mypy ./app
          flake8 ./app

      - name: Run tests
        working-directory: ./services/ai
        run: python -m pytest tests/ -v
