name: Deploy to VPS

on:
  push:
    branches: [main]
    # Each deploy recreates containers (brief 502s) — skip pushes that can't change the backend.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "openspec/**"
      - "frontend-typescript/**"
      - "terraform/**"
      - ".claude/**"
      - ".agents/**"
  workflow_dispatch:

# Two pushes to main close together (e.g. merging two PRs back-to-back) would
# otherwise trigger overlapping `docker compose up --build` runs on the same
# box, racing to recreate the same containers — queue them instead of racing.
concurrency:
  group: deploy-to-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          USERS_DATABASE_URL: ${{ secrets.USERS_DATABASE_URL }}
          BUDGET_DATABASE_URL: ${{ secrets.BUDGET_DATABASE_URL }}
          AI_DATABASE_URL: ${{ secrets.AI_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHAT_DATABASE_URL: ${{ secrets.CHAT_DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          STORAGE_ENDPOINT_URL: ${{ secrets.STORAGE_ENDPOINT_URL }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          MAILERSEND_API_TOKEN: ${{ secrets.MAILERSEND_API_TOKEN }}
          MAILERSEND_SENDER_DOMAIN: ${{ secrets.MAILERSEND_SENDER_DOMAIN }}
          MAILERSEND_SENDER_EMAIL: ${{ secrets.MAILERSEND_SENDER_EMAIL }}
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          MAILJET_SENDER_EMAIL: ${{ secrets.MAILJET_SENDER_EMAIL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
          GRAFANA_CLOUD_OTLP_ENDPOINT: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
          GRAFANA_CLOUD_OTLP_HEADERS: ${{ secrets.GRAFANA_CLOUD_OTLP_HEADERS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Default is 10m — the ai service's ML deps (torch, transformers, etc.)
          # alone take ~15-20m on a cold build; subsequent deploys reuse the
          # Docker layer cache on the server and are much faster.
          command_timeout: 40m
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,RABBITMQ_USER,RABBITMQ_PASS,USERS_DATABASE_URL,BUDGET_DATABASE_URL,AI_DATABASE_URL,ANTHROPIC_API_KEY,CHAT_DATABASE_URL,JWT_SECRET_KEY,ENCRYPTION_KEY,STORAGE_ENDPOINT_URL,STORAGE_ACCESS_KEY,STORAGE_SECRET_KEY,MAILERSEND_API_TOKEN,MAILERSEND_SENDER_DOMAIN,MAILERSEND_SENDER_EMAIL,MAILJET_API_KEY,MAILJET_SECRET_KEY,MAILJET_SENDER_EMAIL,BREVO_API_KEY,BREVO_SENDER_EMAIL,FRONTEND_BASE_URL,GRAFANA_CLOUD_OTLP_ENDPOINT,GRAFANA_CLOUD_OTLP_HEADERS,SLACK_WEBHOOK_URL
          script: |
            set -euo pipefail
            cd /opt/grandflow

            # This checkout is deploy-only — always reset to match main, never
            # edited by hand on the server.
            git fetch origin main
            git reset --hard origin/main

            # The committed .env.prod / services/*/.env.*.prod files are templates
            # with ${VAR} placeholders. Substitute real values from GitHub Actions
            # secrets in place, in this working tree, right before starting
            # containers — the real values are never committed back.
            VARS='$POSTGRES_USER $POSTGRES_PASSWORD $POSTGRES_DB $RABBITMQ_USER $RABBITMQ_PASS $RABBITMQ_URL $USERS_DATABASE_URL $BUDGET_DATABASE_URL $AI_DATABASE_URL $ANTHROPIC_API_KEY $CHAT_DATABASE_URL $JWT_SECRET_KEY $ENCRYPTION_KEY $STORAGE_ENDPOINT_URL $STORAGE_ACCESS_KEY $STORAGE_SECRET_KEY $MAILERSEND_API_TOKEN $MAILERSEND_SENDER_DOMAIN $MAILERSEND_SENDER_EMAIL $MAILJET_API_KEY $MAILJET_SECRET_KEY $MAILJET_SENDER_EMAIL $BREVO_API_KEY $BREVO_SENDER_EMAIL $FRONTEND_BASE_URL $GRAFANA_CLOUD_OTLP_ENDPOINT $GRAFANA_CLOUD_OTLP_HEADERS $SLACK_WEBHOOK_URL'
            for f in .env.prod services/users/.env.users.prod services/budget/.env.budget.prod services/ai/.env.ai.prod services/chat/.env.chat.prod services/worker/.env.worker.prod; do
              envsubst "$VARS" < "$f" > "$f.real"
              mv "$f.real" "$f"
            done

            # Reclaim space from images/build cache orphaned by the previous
            # deploy before building — runs unconditionally (success or
            # failure) each time, so cruft never has a chance to compound.
            docker image prune -a -f
            docker builder prune -f

            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

            # Caddyfile is bind-mounted as a single file (docker-compose.prod.yml).
            # `up -d` above never recreates the caddy container just because the
            # file on disk changed — the service definition itself didn't change
            # — and a single-file bind mount is bound to the host file's inode,
            # not its path: `git reset --hard` unlinks and rewrites the file
            # (new inode) rather than editing in place, so a long-running
            # container's mount keeps serving whatever content existed when it
            # last started, even after `caddy reload` (confirmed: reload runs
            # clean but re-applies the same stale config). A restart forces the
            # runtime to redo the bind mount against the current file.
            docker compose --env-file .env.prod -f docker-compose.prod.yml restart caddy
