name: Branch Naming

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # <Service>/<type>/Issue-<sub-issue>/<description>, see docs/development/WORKFLOW.md §2
          if [[ ! "$BRANCH" =~ ^[A-Z][A-Za-z]*/(feat|fix|chore|refactor)/Issue-[0-9]+/.+$ ]]; then
            echo "::error::Branch '$BRANCH' doesn't match <Service>/<type>/Issue-<n>/<description>."
            echo "::error::Create branches with scripts/start-group.sh — see docs/development/WORKFLOW.md"
            exit 1
          fi
